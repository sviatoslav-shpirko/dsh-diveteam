                # CORE MEMORY — Система «DiveTeam»

                ## Владелец и окружение
                - **Владелец:** Слава (`@slava`). Язык общения — русский, лаконично и по делу.
                - **Локальный стенд сборки:** `p1-arch` (Arch Linux, `/home/slava/Projects/DSH`).
                - **Целевой боевой хост:** `diveteam` (`192.168.0.55`, Raspberry Pi 5 8GB RAM, Debian 13 Trixie, Docker, PostgreSQL 16, n8n).
                - **Хранилище знаний (`vault/`):** `/home/slava/Projects/DSH/vault` — отдельный Git-репозиторий (ветка `main`), синхронизируемый с приватным GitHub-репозиторием `https://github.com/sviatoslav-shpirko/memvault.git` через `/home/slava/.local/bin/vault-sync`.
                  - Индексируется через `graphify` (граф: `vault/graphify-out/graph.json`, сводка: `vault/graphify-out/GRAPH_REPORT.md`).
                  - Быстрый поиск по графу: `vault-sync query "<запрос>"` или `graphify query "<запрос>" --graph /home/slava/Projects/DSH/vault/graphify-out/graph.json`.
                  - Обновление графа и синхронизация с GitHub: `vault-sync` (выполняет `graphify update`, `git commit` и `git push origin main`).
                - **Авторизация GitHub (`dsh-github-token` / KDE Wallet, скилл `creds`):**
                  - Все операции с GitHub (`git clone`, `git pull`, `git push`, `gh`, GitHub API) в `dsh` и субагентах выполняются **строго по HTTPS с токеном из KDE Wallet** (`kdewallet`, папка `Git_tokens`, запись `github_first_test_token`; на хосте — `/dev/shm/hermes-creds/GITHUB_TOKEN`) через `/home/slava/.local/bin/dsh-github-token` и `/home/slava/.local/bin/dsh-git-credential-helper` (поддерживаются переменные `$DIVETEAM_GITHUB_TOKEN`, `$FARVATER_GITHUB_TOKEN`, `$GH_TOKEN` и `$GITHUB_TOKEN`), а **не** через SSH-ключи (`~/.ssh/*`).
                  - Любые URL вида `git@github.com:` автоматически перенаправляются на `https://github.com/`.
                  - ⛔ **Безопасность:** токен никогда не выводится в открытом виде в логи чата и не сохраняется на диск. Проверка статуса — `dsh-github-token status`.
                - **Интеграция Telegram-бота (`@diveteam_shturman_bot`, `dsh-telegram-token` / KDE Wallet):**
                  - Токен бота хранится в **KDE Wallet** (`kdewallet`, папка `Telegram_bot_tokens`, запись `diveteam_shturman_bot` с фоллбэком на `farvater_shturman_bot`) и извлекается в память через `/home/slava/.local/bin/dsh-telegram-token` (`DIVETEAM_TG_BOT_TOKEN` с фоллбэком на `FARVATER_TG_BOT_TOKEN`).
                  - Разрешённый ID владельца (белый список `chat.id` и `from.id`): **`81815557`** (`DIVETEAM_TG_CHAT_ID="81815557"`, `DIVETEAM_TG_USER_ID="81815557"`, с фоллбэком на `FARVATER_*`).
                  - Команды в Telegram: `/status`, `/tasks`, `/approve <id>`, `/reject <id>` и живой диалог со Штурманом (`shturman`). Проверка: `dsh-telegram-token status`, отправка: `dsh-telegram-token send "..."`.
                - **Адаптер Antigravity CLI (`dsh-agy`) и скилл `agy`:** вызов `agy` выполняется строго через `/home/slava/.local/bin/dsh-agy` (`dsh-agy status`, `dsh-agy models`, `dsh-agy run --workdir <dir> "<task>"`; для `sre` доступен `--sudo`). Запрещённая переменная `OPENCODE_API_KEY` никогда не используется (разрешена только `OPENCODE_GO_API_KEY`).

