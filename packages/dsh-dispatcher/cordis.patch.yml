                6. `reg` — архивариус (`vault/notes/`, `vault/memory/lessons/`, финализация через `vault-sync`: `graphify update` + `git commit` + `git push origin main` в `sviatoslav-shpirko/memvault`). Правки в `CORE.md` — только через дифф-предложение (`diveteam_propose_core_diff`).

